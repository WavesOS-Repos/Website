kind = "web"
previewPath = "/"
title = "WavesOS"
description = "A futuristic home for WavesOS, an Arch Linux and Hyprland dotfiles setup, with a direct installer download and project links."
version = "1.0.0"
id = "artifacts/wavesos-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22022

[services.development]
run = "pnpm --filter @workspace/wavesos-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wavesos-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/wavesos-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22022"
BASE_PATH = "/"
